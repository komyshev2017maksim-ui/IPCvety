<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профили</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0e1013; --side: #121519; --panel: #15181d; --raise: #1b1f26; --hover: #1e232b;
    --line: #262b34; --line-soft: #1e222a; --ink: #e8eaee; --muted: #8b93a1; --faint: #5d6573;
    --accent: #37d39a; --accent-ink: #06231a; --accent-soft: rgba(55, 211, 154, .13);
    --bad: #ff6b6b; --warn: #f2b84b; --warn-soft: rgba(242, 184, 75, .12);
    --s-none: #6b7380; --s-prep: #f2c94c; --s-reg: #5aa9ff; --s-warm: #ff9a4d; --s-live: #37d39a; --s-issue: #ff7eb6; --s-ban: #ff5c5c;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8; --side: #eef0f3; --panel: #ffffff; --raise: #ffffff; --hover: #f1f3f6;
    --line: #dfe3e9; --line-soft: #e9ecf1; --ink: #171a1f; --muted: #5c6573; --faint: #8a93a1;
    --accent: #0f9d6c; --accent-ink: #ffffff; --accent-soft: rgba(15, 157, 108, .1);
    --bad: #d63b3b; --warn: #a56a00; --warn-soft: rgba(214, 150, 20, .14);
    --s-none: #8a93a1; --s-prep: #b98900; --s-reg: #1f73d1; --s-warm: #d96a12; --s-live: #0f9d6c; --s-issue: #cf3d85; --s-ban: #d63b3b;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 "Inter", "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 224px 1fr; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  [hidden] { display: none !important; }

  aside { background: var(--side); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 16px; font-weight: 650; font-size: 14px; letter-spacing: -.01em; }
  .brand i { width: 22px; height: 22px; border-radius: 7px; background: conic-gradient(from 210deg, var(--accent), #5aa9ff, var(--accent)); display: block; }
  .nav-title { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; padding: 14px 8px 6px; }
  .nav { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 7px; background: none; color: var(--muted); text-align: left; }
  .nav:hover { background: var(--hover); color: var(--ink); }
  .nav[aria-current="true"] { background: var(--accent-soft); color: var(--ink); }
  .nav .count { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--faint); font-size: 12px; }
  .nav .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .nav .dot.on { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .side-foot { margin-top: auto; padding: 12px 8px 0; color: var(--faint); font-size: 11.5px; display: grid; gap: 8px; overflow-wrap: anywhere; }

  main { min-width: 0; padding: 14px 20px 90px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bar h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; }
  .grow { flex: 1; }
  .field { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 32px; }
  .field::placeholder { color: var(--faint); }
  #search { width: 260px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 0 12px; height: 32px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { border-color: transparent; background: none; color: var(--muted); }
  .btn.ghost:hover { background: var(--hover); color: var(--ink); }
  .btn.danger { color: var(--bad); }
  .btn.small { height: 28px; padding: 0 10px; }
  .notice { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; display: grid; gap: 3px; }
  .notice:empty { display: none; }

  .table { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 940px; }
  th { text-align: left; font-weight: 500; color: var(--faint); font-size: 11.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
  th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.sel { background: var(--accent-soft); }
  td.check, th.check { width: 34px; padding-right: 0; }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; vertical-align: middle; }
  .name { font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .name:hover { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
  .mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); flex: none; }
  .run { width: 92px; justify-content: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 20px; padding: 2px 9px 2px 8px; background: none; white-space: nowrap; font-size: 12px; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--s-none)); }
  button.pill:hover { background: var(--hover); }
  .tag { display: inline-block; border-radius: 5px; background: var(--raise); border: 1px solid var(--line); padding: 0 6px; font-size: 11.5px; color: var(--muted); margin: 2px 4px 0 0; }
  .health { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--faint); }
  .health.ok { background: var(--accent); } .health.bad { background: var(--bad); } .health.warn { background: var(--warn); }
  .steps { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .steps i { display: block; width: 56px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .steps i b { display: block; height: 100%; background: var(--accent); }
  .err { color: var(--bad); font-size: 12px; overflow-wrap: anywhere; max-width: 260px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .kebab { width: 28px; height: 28px; border-radius: 7px; border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; }
  .kebab:hover { background: var(--line); color: var(--ink); }
  .empty { padding: 56px 20px; text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }
  .empty b { color: var(--ink); font-size: 15px; }
  .empty div { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  .menu { position: fixed; z-index: 30; min-width: 230px; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 5px; box-shadow: 0 12px 34px rgba(0,0,0,.35); }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 9px; border-radius: 6px; }
  .menu button:hover { background: var(--hover); }
  .menu .sep { height: 1px; background: var(--line); margin: 5px 2px; }
  .menu .cap { color: var(--faint); font-size: 11px; padding: 5px 9px 2px; }
  .menu .danger { color: var(--bad); }
  #bulk { position: fixed; left: calc(112px + 50%); transform: translateX(-50%); bottom: 18px; z-index: 20; display: flex; gap: 6px; align-items: center;
    background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 7px 8px 7px 14px; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  #bulk span { margin-right: 6px; font-weight: 600; white-space: nowrap; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(470px, 100vw); z-index: 25; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; box-shadow: -18px 0 50px rgba(0,0,0,.3); }
  .d-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  .d-head h2 { margin: 0; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 8px 10px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .d-body { flex: 1; overflow: auto; padding: 14px 16px; }
  .d-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  label { display: grid; gap: 4px; margin-bottom: 11px; color: var(--muted); font-size: 12px; }
  label .field { color: var(--ink); width: 100%; background: var(--bg); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks label { display: flex; align-items: center; gap: 9px; margin: 0; padding: 5px 0; color: var(--ink); font-size: 13px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 7px 10px; margin: 0 0 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .event { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
  .event time { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
  .stack { display: grid; gap: 6px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 18px; width: min(560px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { margin: 0 0 6px; font-size: 15px; }
  dialog textarea { width: 100%; min-height: 190px; resize: vertical; }
  .row-end { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #toast { position: fixed; right: 18px; bottom: 18px; z-index: 40; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 9px; max-width: 420px; white-space: pre-wrap; display: none; }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; } aside { display: none; } #bulk { left: 50%; } }
</style>
</head>
<body>
<aside>
  <div class="brand"><i></i>Профили</div>
  <div id="nav"></div>
  <div class="nav-title">Группы</div>
  <div id="nav-groups"></div>
  <div class="side-foot">
    <button class="btn ghost small" id="theme" type="button">Светлая тема</button>
    <span id="home"></span>
  </div>
</aside>

<main>
  <div class="bar">
    <h1 id="title">Все профили</h1>
    <input class="field" id="search" type="search" placeholder="Поиск: имя, бренд, сайт, IP  ( / )" autocomplete="off">
    <select class="field" id="status-filter" aria-label="Фильтр по статусу"></select>
    <span class="grow"></span>
    <button class="btn" id="check-all" type="button">Проверить все IP</button>
    <button class="btn" id="proxies" type="button">Прокси списком</button>
    <button class="btn" id="import" type="button" data-menu="1">Импорт</button>
    <button class="btn primary" id="new" type="button">+ Новый профиль</button>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <input type="file" id="cookie-file" accept=".json,.txt,application/json,text/plain" hidden>
  </div>
  <div class="notice" id="notice"></div>
  <div class="table">
    <table>
      <thead><tr>
        <th class="check"><input type="checkbox" id="all" aria-label="Выбрать все"></th>
        <th class="sort" data-sort="name">Профиль</th>
        <th></th>
        <th class="sort" data-sort="status">Статус</th>
        <th>Прокси и выход</th>
        <th>Шаги</th>
        <th class="sort" data-sort="last_opened">Последний вход</th>
        <th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<div id="bulk" hidden></div>
<section id="drawer" hidden></section>
<dialog id="paste">
  <h2>Прокси списком</h2>
  <p class="hint" id="paste-hint"></p>
  <textarea class="field mono" id="paste-text" placeholder="203.0.113.10:8000:login:password&#10;login:password@203.0.113.11:8000&#10;socks5://login:password@203.0.113.12:1080"></textarea>
  <div class="row-end">
    <button class="btn" type="button" id="paste-cancel">Отмена</button>
    <button class="btn primary" type="button" id="paste-ok">Раздать</button>
  </div>
</dialog>
<div id="toast"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
let state = { profiles: [], duplicates: {}, groups: [], statuses: [], steps: [], test_pages: [] };
const view = { nav: 'all', group: null, query: '', status: '', sort: 'n', dir: 1 };
const selected = new Set();
const busy = new Set();
let drawer = null;      // { id | null, tab }
let draft = null;       // значения формы карточки между переключениями вкладок
let menuOpen = false;
let cookieTarget = null;

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === false || value == null) continue;
    if (key === 'class') node.className = value;
    else if (key === 'style') node.style.cssText = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (key === 'value') node.value = value;
    else if (key === 'checked') node.checked = value;
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(3)) if (child != null && child !== false) node.append(child);
  return node;
}

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Antidetect': '1' }, body: JSON.stringify(body),
  };
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Ошибка ' + response.status);
  return data;
}

let toastTimer;
function toast(text, ms = 5000) {
  $('toast').textContent = text;
  $('toast').style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').style.display = 'none'; }, ms);
}
const guard = (fn) => async (...args) => { try { return await fn(...args); } catch (error) { toast(error.message, 9000); } finally { await refresh(); } };

// --- справочники -------------------------------------------------------------
const statusName = (key) => (state.statuses.find((s) => s[0] === key) || [null, 'Не начат'])[1];
const flag = (code) => (code && code.length === 2
  ? String.fromCodePoint(...[...code.toUpperCase()].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65)) : '');
const when = (iso) => (iso ? new Date(iso).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '');
const stepsDone = (p) => state.steps.filter((s) => p.steps && p.steps[s[0]]).length;
const failed = (p) => !p.running && /Ошибка|Traceback/.test(p.log || '');
const live = () => state.profiles.filter((p) => !p.deleted_at);
function daysLeft(date) {
  if (!date) return null;
  return Math.ceil((new Date(date + 'T23:59:59') - Date.now()) / 86400000);
}
function needsAttention(p) {
  const left = daysLeft(p.phone_until);
  return failed(p) || ['issue', 'ban'].includes(p.status) || (left !== null && left <= 5)
    || Boolean(p.geo && state.expected_country && p.geo.country && p.geo.country !== state.expected_country);
}
function visible() {
  const q = view.query.toLowerCase();
  let list = state.profiles.filter((p) => (view.nav === 'trash' ? p.deleted_at : !p.deleted_at));
  if (view.nav === 'running') list = list.filter((p) => p.running);
  if (view.nav === 'noproxy') list = list.filter((p) => !p.proxy);
  if (view.nav === 'attention') list = list.filter(needsAttention);
  if (view.group !== null) list = list.filter((p) => (p.group || '') === view.group);
  if (view.status) list = list.filter((p) => (p.status || 'none') === view.status);
  if (q) list = list.filter((p) => [p.name, p.brand, p.site, p.instagram, p.email, p.notes, (p.tags || []).join(' '),
    p.proxy && p.proxy.host, p.geo && p.geo.ip, p.geo && p.geo.city].some((v) => (v || '').toLowerCase().includes(q)));
  const order = state.statuses.map((s) => s[0]);
  const key = (p) => (view.sort === 'status' ? order.indexOf(p.status || 'none')
    : view.sort === 'n' ? (p.n == null ? 1e9 : p.n) : (p[view.sort] || ''));
  return list.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : a.name.localeCompare(b.name)) * view.dir);
}

// --- действия -----------------------------------------------------------------
const act = guard(async (profile, action, body = {}) => {
  busy.add(profile.id); render();
  try {
    const result = await api(`/api/profiles/${profile.id}/${action}`, body);
    if (action === 'check') toast(result.output || 'Готово', 9000);
    if (action === 'open') toast(`${profile.name}: проверяю прокси и открываю браузер`);
    return result;
  } finally { busy.delete(profile.id); }
});
const bulk = guard(async (action, value) => {
  const result = await api('/api/bulk', { ids: [...selected], action, value });
  toast(result.errors.length ? `Готово: ${result.done}. Ошибки:\n${result.errors.join('\n')}` : `Готово: ${result.done}`);
  if (['trash', 'restore'].includes(action)) selected.clear();
});
const checkMany = guard(async (profiles) => {
  $('check-all').disabled = true;
  let bad = 0;
  try {
    for (const profile of profiles) {
      busy.add(profile.id); render();
      try { const r = await api(`/api/profiles/${profile.id}/check`, {}); if (!r.ok) bad++; } catch (e) { bad++; }
      busy.delete(profile.id); await refresh();
    }
  } finally { $('check-all').disabled = false; }
  toast(`Проверено ${profiles.length}, с проблемами ${bad}`);
});
function download(name, text) {
  const link = el('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: name });
  document.body.append(link); link.click(); link.remove();
}
const exportCookies = guard(async (profile) => {
  toast(`${profile.name}: читаю cookies…`);
  const result = await api(`/api/profiles/${profile.id}/cookies-export`, {});
  download(`${profile.name}-cookies.json`, JSON.stringify(result.cookies, null, 2));
  toast(`${profile.name}: выгружено cookies ${result.cookies.length}`);
});
const seed = guard(async () => { const r = await api('/api/seed', {}); toast(`Создано карточек: ${r.created.length}, обновлено: ${r.updated.length}`); });

// --- меню -----------------------------------------------------------------------
function openMenu(anchor, items) {
  closeMenu();
  const menu = el('div', { class: 'menu', id: 'menu' }, items.map((item) =>
    item === '-' ? el('div', { class: 'sep' })
      : typeof item === 'string' ? el('div', { class: 'cap' }, item)
      : el('button', { type: 'button', class: item.danger ? 'danger' : '', onclick: () => { closeMenu(); item.run(); } }, item.label)));
  document.body.append(menu);
  const box = anchor.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(box.right - menu.offsetWidth, innerWidth - menu.offsetWidth - 8)) + 'px';
  menu.style.top = (box.bottom + menu.offsetHeight + 8 > innerHeight ? Math.max(8, box.top - menu.offsetHeight - 4) : box.bottom + 4) + 'px';
  menuOpen = true;
}
function closeMenu() { const menu = $('menu'); if (menu) menu.remove(); menuOpen = false; }
document.addEventListener('click', (event) => { if (menuOpen && !event.target.closest('.menu, .kebab, .pill, [data-menu]')) closeMenu(); });

function rowMenu(anchor, p) {
  if (p.deleted_at) {
    return openMenu(anchor, [
      { label: 'Восстановить', run: () => act(p, 'restore') },
      { label: 'Удалить навсегда', danger: true, run: () => confirm(`Удалить ${p.name} вместе с cookies и сессиями? Вернуть будет нельзя.`) && act(p, 'purge') },
    ]);
  }
  openMenu(anchor, [
    { label: 'Открыть карточку', run: () => openDrawer(p.id) },
    { label: 'Проверить IP', run: () => act(p, 'check') },
    '-', 'Открыть на странице проверки',
    ...state.test_pages.map(([label, url]) => ({ label, run: () => act(p, 'open', { url }) })),
    '-',
    { label: 'Сделать копию', run: () => act(p, 'clone') },
    { label: 'Экспорт cookies', run: () => exportCookies(p) },
    { label: 'Импорт cookies', run: () => { cookieTarget = p; $('cookie-file').click(); } },
    '-',
    { label: 'В корзину', danger: true, run: () => act(p, 'trash') },
  ]);
}
function statusMenu(anchor, run) {
  openMenu(anchor, state.statuses.map(([key, label]) => ({ label, run: () => run(key) })));
}

// --- таблица ---------------------------------------------------------------------
function proxyCell(p) {
  if (!p.proxy) return el('span', { class: 'sub' }, 'прокси не задан');
  const geo = p.geo;
  const wrong = geo && state.expected_country && geo.country && geo.country !== state.expected_country;
  const health = !geo ? '' : wrong ? 'bad' : (geo.ping_ms || 0) > 2500 ? 'warn' : 'ok';
  return [
    el('div', { class: 'mono' }, el('span', { class: 'health ' + health, title: geo ? 'проверен ' + when(geo.checked_at) : 'IP не проверен' }),
      geo ? `${flag(geo.country)} ${geo.ip}` : `${p.proxy.host}:${p.proxy.port}`),
    el('div', { class: 'sub' }, geo
      ? [geo.city, geo.region].filter(Boolean).join(', ') + (geo.ping_ms ? ` · ${geo.ping_ms} мс` : '')
      : (p.proxy_city || 'IP не проверен')),
  ];
}
function runButton(p, extra = '') {
  const isBusy = busy.has(p.id);
  if (p.deleted_at) return el('button', { class: 'btn small run ' + extra, type: 'button', onclick: () => act(p, 'restore') }, 'Вернуть');
  if (p.running) return el('button', { class: 'btn small run ' + extra, type: 'button', disabled: isBusy, onclick: () => act(p, 'stop') }, 'Закрыть');
  return el('button', { class: 'btn small primary run ' + extra, type: 'button', disabled: isBusy, onclick: () => act(p, 'open') }, isBusy ? '…' : 'Открыть');
}
function row(p) {
  const done = stepsDone(p);
  const left = daysLeft(p.phone_until);
  return el('tr', { class: selected.has(p.id) ? 'sel' : '' },
    el('td', { class: 'check' }, el('input', { type: 'checkbox', checked: selected.has(p.id), 'aria-label': 'Выбрать ' + p.name,
      onchange: (e) => { if (e.target.checked) selected.add(p.id); else selected.delete(p.id); render(); } })),
    el('td', {},
      el('span', { class: 'name', onclick: () => openDrawer(p.id) }, p.running ? el('i', { class: 'live' }) : null, p.name),
      el('div', { class: 'sub' }, [p.brand, p.site].filter(Boolean).join(' · ')),
      (p.instagram || (p.tags || []).length) ? el('div', {}, p.instagram ? el('span', { class: 'tag' }, '@' + p.instagram.replace(/^@/, '')) : null,
        (p.tags || []).map((t) => el('span', { class: 'tag' }, t))) : null),
    el('td', {}, runButton(p)),
    el('td', {}, el('button', { class: 'pill', type: 'button', style: `--c: var(--s-${p.status || 'none'})`,
      onclick: (e) => statusMenu(e.currentTarget, (key) => act(p, 'update', { status: key })) }, statusName(p.status))),
    el('td', {}, proxyCell(p)),
    el('td', {}, el('div', { class: 'steps' }, el('i', {}, el('b', { style: `width:${(done / Math.max(1, state.steps.length)) * 100}%` })), `${done}/${state.steps.length}`),
      left !== null && left <= 5 ? el('div', { class: 'err' }, left < 0 ? 'аренда номера истекла' : `номер: осталось ${left} дн.`) : null),
    el('td', {}, el('div', { class: 'sub' }, p.running ? 'открыт сейчас' : (when(p.last_opened) || 'не открывался')),
      failed(p) ? el('div', { class: 'err', title: p.log }, p.log.replace(/^[\s\S]*?Ошибка: /, '')) : null),
    el('td', {}, el('button', { class: 'kebab', type: 'button', 'aria-label': 'Действия', onclick: (e) => rowMenu(e.currentTarget, p) }, '⋯')),
  );
}

function navButton(label, key, count, dot) {
  return el('button', { class: 'nav', type: 'button', 'aria-current': String(view.nav === key && view.group === null),
    onclick: () => { view.nav = key; view.group = null; selected.clear(); render(); } },
    dot != null ? el('i', { class: 'dot' + (dot ? ' on' : '') }) : null, label, el('span', { class: 'count' }, String(count)));
}
function renderSide() {
  const all = live();
  $('nav').replaceChildren(
    navButton('Все профили', 'all', all.length),
    navButton('Открытые', 'running', all.filter((p) => p.running).length, all.some((p) => p.running)),
    navButton('Требуют внимания', 'attention', all.filter(needsAttention).length),
    navButton('Без прокси', 'noproxy', all.filter((p) => !p.proxy).length),
    navButton('Корзина', 'trash', state.profiles.length - all.length),
  );
  const groups = [...new Set([...state.groups, ...all.map((p) => p.group).filter(Boolean)])];
  $('nav-groups').replaceChildren(...groups.map((g) => el('button', { class: 'nav', type: 'button',
    'aria-current': String(view.group === g), onclick: () => { view.nav = 'all'; view.group = g; selected.clear(); render(); } },
    g, el('span', { class: 'count' }, String(all.filter((p) => p.group === g).length)))));
  $('home').textContent = state.home ? 'Данные: ' + state.home : '';
}
function renderBulk() {
  const bar = $('bulk');
  bar.hidden = selected.size === 0;
  if (bar.hidden) return;
  const trash = view.nav === 'trash';
  bar.replaceChildren(el('span', {}, `Выбрано: ${selected.size}`), ...(trash ? [
    el('button', { class: 'btn small', type: 'button', onclick: () => bulk('restore') }, 'Восстановить'),
  ] : [
    el('button', { class: 'btn small primary', type: 'button', onclick: () => bulk('open') }, 'Открыть'),
    el('button', { class: 'btn small', type: 'button', onclick: () => bulk('stop') }, 'Закрыть'),
    el('button', { class: 'btn small', type: 'button', onclick: () => checkMany(state.profiles.filter((p) => selected.has(p.id) && p.proxy)) }, 'Проверить IP'),
    el('button', { class: 'btn small', type: 'button', 'data-menu': 1, onclick: (e) => statusMenu(e.currentTarget, (key) => bulk('status', key)) }, 'Статус ▾'),
    el('button', { class: 'btn small', type: 'button', 'data-menu': 1,
      onclick: (e) => openMenu(e.currentTarget, state.groups.map((g) => ({ label: g, run: () => bulk('group', g) }))) }, 'Группа ▾'),
    el('button', { class: 'btn small', type: 'button', onclick: () => openPaste(true) }, 'Прокси списком'),
    el('button', { class: 'btn small danger', type: 'button', onclick: () => bulk('trash') }, 'В корзину'),
  ]), el('button', { class: 'btn small ghost', type: 'button', 'aria-label': 'Снять выбор', onclick: () => { selected.clear(); render(); } }, '✕'));
}
function render() {
  const list = visible();
  renderSide();
  $('title').textContent = view.group !== null ? view.group
    : { all: 'Все профили', running: 'Открытые', attention: 'Требуют внимания', noproxy: 'Без прокси', trash: 'Корзина' }[view.nav];
  $('rows').replaceChildren(...list.map(row));
  $('all').checked = list.length > 0 && list.every((p) => selected.has(p.id));
  const empty = $('empty');
  empty.hidden = list.length > 0;
  if (!list.length) {
    empty.replaceChildren(...(state.profiles.length === 0 ? [
      el('b', {}, 'Профилей пока нет'),
      el('span', {}, 'Создайте карточки всех 33 брендов одной кнопкой или заведите профиль вручную.'),
      el('div', {}, el('button', { class: 'btn primary', type: 'button', onclick: seed }, 'Создать 33 карточки брендов'),
        el('button', { class: 'btn', type: 'button', onclick: () => openDrawer(null) }, 'Новый профиль'),
        el('button', { class: 'btn', type: 'button', onclick: () => $('import-file').click() }, 'Импорт JSON')),
    ] : [el('span', {}, view.nav === 'trash' ? 'Корзина пуста.' : 'Под этот фильтр ничего не подошло.')]));
  }
  $('notice').replaceChildren(...Object.entries(state.duplicates).map(([what, names]) => el('div', {}, `Повтор: ${what} у профилей ${names.join(', ')}`)));
  renderBulk();
  const head = $('drawer-run');
  if (head && drawer && drawer.id) {
    const p = state.profiles.find((x) => x.id === drawer.id);
    if (p) head.replaceChildren(runButton(p));
  }
}
async function refresh() {
  try { state = await api('/api/state'); } catch (error) { return; }
  if (!$('status-filter').options.length) {
    $('status-filter').replaceChildren(el('option', { value: '' }, 'Любой статус'), ...state.statuses.map(([k, label]) => el('option', { value: k }, label)));
  }
  if (!menuOpen) render();
}

// --- боковая карточка -------------------------------------------------------------
function input(name, label, value, extra = {}) {
  return el('label', {}, label, el(extra.area ? 'textarea' : 'input', { class: 'field' + (extra.mono ? ' mono' : ''), name,
    type: extra.area ? null : (extra.type || 'text'), placeholder: extra.placeholder, rows: extra.area ? 3 : null,
    autocomplete: 'off', required: extra.required, value: value || '' }));
}
function select(name, label, value, options) {
  return el('label', {}, label, el('select', { class: 'field', name }, options.map(([k, text]) => el('option', { value: k, selected: k === (value || '') }, text))));
}
function openDrawer(id, tab = 'card') { draft = null; drawer = { id, tab }; closeMenu(); renderDrawer(); }
function closeDrawer() { drawer = null; draft = null; $('drawer').hidden = true; }
function collect(form, raw = false) {
  const body = {}; const steps = {};
  for (const node of form.elements) {
    if (!node.name) continue;
    if (raw) { body[node.name] = node.type === 'checkbox' ? node.checked : node.value; continue; }
    if (node.name.startsWith('step:')) steps[node.name.slice(5)] = node.checked;
    else if (node.name === 'tags') body.tags = node.value.split(',').map((t) => t.trim()).filter(Boolean);
    else body[node.name] = node.value.trim();
  }
  if (!raw && Object.keys(steps).length) body.steps = steps;
  return body;
}
function renderDrawer() {
  const box = $('drawer');
  const p = drawer.id ? state.profiles.find((x) => x.id === drawer.id) : null;
  if (drawer.id && !p) return closeDrawer();
  const creating = !p;
  const proxyText = p && p.proxy ? (p.proxy.scheme === 'http' ? '' : p.proxy.scheme + '://') + `${p.proxy.host}:${p.proxy.port}` : '';
  const groups = [['', 'Без группы'], ...state.groups.map((g) => [g, g])];
  if (p && p.group && !state.groups.includes(p.group)) groups.push([p.group, p.group]);
  const section = (key, ...children) => el('div', { hidden: drawer.tab !== key }, children);

  const card = section('card',
    el('div', { class: 'two' }, input('name', 'Название профиля', p ? p.name : '', { required: true, placeholder: 'IG-34' }), input('brand', 'Бренд', p && p.brand)),
    el('div', { class: 'two' }, input('site', 'Сайт', p && p.site), select('group', 'Группа', p && p.group, groups)),
    creating ? [
      input('proxy', 'Прокси одной строкой', '', { mono: true, placeholder: 'host:port:login:password' }),
      input('proxy_city', 'Город и штат прокси', '', { placeholder: 'Miami, FL' }),
    ] : [
      el('div', { class: 'two' }, select('status', 'Статус', p.status || 'none', state.statuses), input('tags', 'Метки через запятую', (p.tags || []).join(', '))),
      el('div', { class: 'two' }, input('instagram', 'Логин Instagram', p.instagram, { placeholder: 'без @' }), input('email', 'Почта аккаунта', p.email)),
      el('div', { class: 'two' }, input('phone', 'Номер телефона', p.phone, { placeholder: '+1…' }), input('phone_until', 'Аренда номера до', p.phone_until, { type: 'date' })),
      input('notes', 'Заметки', p.notes, { area: true }),
      el('div', { class: 'nav-title', style: 'padding-left:0' }, 'Шаги запуска'),
      el('div', { class: 'checks' }, state.steps.map(([key, label]) => el('label', {}, el('input', { type: 'checkbox', name: 'step:' + key, checked: Boolean(p.steps && p.steps[key]) }), label))),
    ]);

  const proxy = creating ? null : section('proxy',
    el('p', { class: 'hint' }, 'Форматы: host:port, host:port:login:password, login:password@host:port, socks5://… Один прокси на один профиль.'),
    input('proxy', 'Адрес прокси', proxyText, { mono: true, placeholder: '203.0.113.10:8000' }),
    el('div', { class: 'two' }, input('proxy_user', 'Логин', p.proxy && p.proxy.username),
      input('proxy_pass', 'Пароль', '', { type: 'password', placeholder: p.proxy && p.proxy.has_password ? 'сохранён, оставьте пустым' : '' })),
    el('div', { class: 'two' }, input('proxy_city', 'Город и штат', p.proxy_city, { placeholder: 'Miami, FL' }), input('timezone', 'Пояс вручную', p.timezone, { placeholder: 'определится по IP' })),
    el('dl', { class: 'kv' },
      el('dt', {}, 'IP выхода'), el('dd', { class: 'mono' }, p.geo ? `${flag(p.geo.country)} ${p.geo.ip}` : 'не проверен'),
      el('dt', {}, 'Где'), el('dd', {}, p.geo ? [p.geo.city, p.geo.region, p.geo.country].filter(Boolean).join(', ') : '—'),
      el('dt', {}, 'Провайдер'), el('dd', {}, (p.geo && p.geo.org) || '—'),
      el('dt', {}, 'Отклик'), el('dd', {}, p.geo && p.geo.ping_ms ? p.geo.ping_ms + ' мс' : '—'),
      el('dt', {}, 'Пояс браузера'), el('dd', {}, p.effective_timezone || 'неизвестен'),
      el('dt', {}, 'Проверен'), el('dd', {}, p.geo ? when(p.geo.checked_at) : '—')),
    el('button', { class: 'btn', type: 'button', disabled: !p.proxy, onclick: async () => { await act(p, 'check'); if (drawer) renderDrawer(); } }, 'Проверить IP'));

  const fp = p && p.fingerprint;
  const print = creating ? null : section('print',
    el('p', { class: 'hint' }, 'Отпечаток создаётся один раз и не меняется между входами. Система, версия браузера и шрифты настоящие.'),
    el('dl', { class: 'kv' },
      el('dt', {}, 'Экран'), el('dd', {}, `${fp.screen.width}×${fp.screen.height}`),
      el('dt', {}, 'Ядра и память'), el('dd', {}, `${fp.hardwareConcurrency} ядер, ${fp.deviceMemory} ГБ`),
      el('dt', {}, 'Видеокарта'), el('dd', {}, fp.webgl ? fp.webgl.renderer : 'настоящая'),
      el('dt', {}, 'Canvas и аудио'), el('dd', {}, 'шум по зерну ' + fp.seed),
      el('dt', {}, 'WebRTC'), el('dd', {}, 'только через прокси'),
      el('dt', {}, 'Пояс и геолокация'), el('dd', {}, 'по IP прокси')),
    el('div', { class: 'nav-title', style: 'padding-left:0' }, 'Посмотреть на профиль глазами сайта'),
    el('div', { class: 'stack' }, state.test_pages.map(([label, url]) => el('button', { class: 'btn', type: 'button', disabled: p.running,
      onclick: () => act(p, 'open', { url }) }, label))),
    el('p', { class: 'hint', style: 'margin-top:14px' }, 'Новый отпечаток сайты воспримут как новое устройство.'),
    el('button', { class: 'btn danger', type: 'button', onclick: guard(async () => {
      if (!confirm(`Сменить отпечаток ${p.name}?`)) return;
      await api(`/api/profiles/${p.id}/regen`, {}); toast('Отпечаток сменён'); await refresh(); if (drawer) renderDrawer();
    }) }, 'Новый отпечаток'));

  const log = creating ? null : section('log', el('div', { id: 'events' }, el('p', { class: 'hint' }, 'Загружаю…')));
  const tabs = creating ? null : el('div', { class: 'tabs', role: 'tablist' }, [['card', 'Карточка'], ['proxy', 'Прокси'], ['print', 'Отпечаток'], ['log', 'Журнал']]
    .map(([key, label]) => el('button', { type: 'button', role: 'tab', 'aria-selected': String(drawer.tab === key),
      onclick: () => { draft = { id: drawer.id, values: collect($('drawer-form'), true) }; drawer.tab = key; renderDrawer(); } }, label)));

  const form = el('form', { class: 'd-body', id: 'drawer-form', onsubmit: guard(async (event) => {
    event.preventDefault();
    const body = collect(event.target);
    if (creating) { const r = await api('/api/profiles', body); toast('Профиль создан'); await refresh(); return openDrawer(r.id, 'proxy'); }
    await api(`/api/profiles/${p.id}`, body);
    draft = null; toast('Сохранено'); await refresh(); if (drawer) renderDrawer();
  }) }, card, proxy, print, log);

  box.replaceChildren(
    el('div', { class: 'd-head' }, el('h2', {}, creating ? 'Новый профиль' : p.name),
      creating ? null : el('span', { id: 'drawer-run' }, runButton(p)),
      el('button', { class: 'kebab', type: 'button', 'aria-label': 'Закрыть карточку', onclick: closeDrawer }, '✕')),
    tabs, form,
    el('div', { class: 'd-foot' }, el('button', { class: 'btn primary', type: 'submit', form: 'drawer-form' }, creating ? 'Создать' : 'Сохранить'),
      el('button', { class: 'btn', type: 'button', onclick: closeDrawer }, 'Отмена')));
  box.hidden = false;
  if (draft && draft.id === drawer.id) {
    for (const node of form.elements) {
      if (!node.name || !(node.name in draft.values)) continue;
      if (node.type === 'checkbox') node.checked = draft.values[node.name]; else node.value = draft.values[node.name];
    }
  }
  if (!creating && drawer.tab === 'log') loadEvents(p);
}
async function loadEvents(p) {
  try {
    const { events } = await api(`/api/profiles/${p.id}/events`, {});
    const box = $('events'); if (!box) return;
    box.replaceChildren(...(events.length ? events.map((e) => el('div', { class: 'event' }, el('time', {}, when(e.t)), el('span', {}, e.text)))
      : [el('p', { class: 'hint' }, 'Пока пусто. Сюда попадают запуски, проверки IP и смены статуса.')]));
  } catch (error) { /* журнал необязателен */ }
}

// --- прокси списком, импорт, тема ---------------------------------------------------
let pasteSelected = false;
function openPaste(forSelected) {
  pasteSelected = Boolean(forSelected && selected.size);
  $('paste-hint').textContent = pasteSelected
    ? `По одному прокси на строку. Раздам ${selected.size} выбранным профилям по порядку в таблице.`
    : 'По одному прокси на строку. Раздам профилям без прокси, сверху вниз.';
  $('paste-text').value = '';
  $('paste').showModal();
}
$('paste-cancel').addEventListener('click', () => $('paste').close());
$('paste-ok').addEventListener('click', guard(async () => {
  const ids = pasteSelected ? visible().filter((p) => selected.has(p.id)).map((p) => p.id) : [];
  const r = await api('/api/proxies', { text: $('paste-text').value, ids });
  $('paste').close();
  toast(`Назначено: ${r.assigned.length}` + (r.left_proxies ? `, лишних прокси: ${r.left_proxies}` : '') + (r.left_profiles ? `, профилей без прокси осталось: ${r.left_profiles}` : ''));
}));
$('proxies').addEventListener('click', () => openPaste(false));
$('check-all').addEventListener('click', () => checkMany(visible().filter((p) => p.proxy && !p.deleted_at)));
$('new').addEventListener('click', () => openDrawer(null));
$('import').addEventListener('click', (e) => openMenu(e.currentTarget, [
  { label: 'Файл instagram-profiles.json из панели учёта', run: () => $('import-file').click() },
  { label: 'Создать карточки 33 брендов', run: seed },
]));
$('import-file').addEventListener('change', guard(async (event) => {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  const r = await api('/api/import', JSON.parse(await file.text()));
  toast(`Создано ${r.created.length}, обновлено ${r.updated.length}, без изменений ${r.unchanged.length}`);
}));
$('cookie-file').addEventListener('change', guard(async (event) => {
  const file = event.target.files[0]; event.target.value = '';
  if (!file || !cookieTarget) return;
  const r = await api(`/api/profiles/${cookieTarget.id}/cookies-import`, { text: await file.text() });
  toast(`${cookieTarget.name}: загружено cookies ${r.count}`);
}));
$('search').addEventListener('input', (e) => { view.query = e.target.value.trim(); render(); });
$('status-filter').addEventListener('change', (e) => { view.status = e.target.value; render(); });
$('all').addEventListener('change', (e) => { for (const p of visible()) { if (e.target.checked) selected.add(p.id); else selected.delete(p.id); } render(); });
for (const th of document.querySelectorAll('th.sort')) {
  th.addEventListener('click', () => { view.dir = view.sort === th.dataset.sort ? -view.dir : 1; view.sort = th.dataset.sort; render(); });
}
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') { if (menuOpen) closeMenu(); else if (drawer && !$('paste').open) closeDrawer(); }
  if (event.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { event.preventDefault(); $('search').focus(); }
});
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('theme').textContent = theme === 'light' ? 'Тёмная тема' : 'Светлая тема';
}
let theme = 'dark';
try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) { /* хранилище недоступно */ }
applyTheme(theme);
$('theme').addEventListener('click', () => {
  theme = theme === 'light' ? 'dark' : 'light'; applyTheme(theme);
  try { localStorage.setItem('theme', theme); } catch (e) { /* не страшно */ }
});

refresh();
setInterval(refresh, 2500);
</script>
